[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cloudwatch-mcp"
version = "0.1.0"
description = "Strictly read-only AWS CloudWatch observability MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "boto3>=1.34",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aws-cloudwatch-mcp = "aws_cw_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
